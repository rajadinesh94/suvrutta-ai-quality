<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reference conversation</title><style>
body{font:1rem/1.5 system-ui,sans-serif;max-width:48rem;margin:2rem auto;padding:0 1rem;color:#172b30;background:#f6faf8}main{background:white;padding:1.5rem;border:1px solid #c8d5d0;border-radius:1rem}label{display:block;margin-top:1rem;font-weight:600}textarea,input,select,button{font:inherit}textarea,input,select{box-sizing:border-box;width:100%;padding:.6rem;border:1px solid #657c75;border-radius:.35rem}textarea{min-height:8rem}button{margin:.5rem .35rem .5rem 0;padding:.55rem .8rem;border:0;border-radius:.35rem;background:#164b43;color:white;cursor:pointer}button:focus-visible,textarea:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #d5742b;outline-offset:2px}button:disabled{opacity:.5}#status{min-height:2rem;padding:.5rem;border-left:4px solid #164b43}#source{white-space:pre-wrap;border-left:4px solid #c28d30;padding-left:.8rem}small{color:#455d56}@media(max-width:480px){body{margin:.4rem auto}main{padding:1rem}}
</style></head><body><main><h1>Synthetic conversation reference</h1><p><strong>Simulated responses. Fictional accounts only.</strong> This interface demonstrates evaluation behavior; it does not authenticate users or run a model.</p><label for="actor">Fictional user</label><select id="actor"><option value="mira">Mira</option><option value="noor">Noor</option></select><label for="experience">Experience or question</label><textarea id="experience" placeholder="I walked by the river and felt hopeful."></textarea><div><button id="draft">Create editable draft</button><button id="save">Confirm and save</button><button id="retrieve">Find my story</button><button id="cancel">Cancel request</button></div><label><input id="consent" type="checkbox" checked style="width:auto"> Allow saving and finding my stories</label><label for="fault">Simulated fault</label><select id="fault"><option value="none">None</option><option value="before">Failed write</option><option value="after">Uncertain write</option><option value="timeout">Slow response</option></select><p id="status" role="status" aria-live="polite">Ready.</p><h2>Source</h2><p id="source">No source selected.</p><small>Demo data is held in memory and resets when this server restarts.</small></main><script type="module" src="/ui.mjs"></script></body></html>
