name: Synthetic reference quality
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/sanitize-scan.mjs --shareable-only
      - run: npm run typecheck
      - run: npm test
      - run: npm run evaluate
      - run: npm run negative-control
      - run: npm audit --audit-level=high
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: synthetic-reference-summaries
          path: |
            reports/runs/**/*.md
            reports/runs/**/provenance.json
          retention-days: 7
          if-no-files-found: ignore
  python-evaluations:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEEPEVAL_DISABLE_DOTENV: '1'
      DEEPEVAL_TELEMETRY_OPT_OUT: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.16.0'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-eval.txt
      - run: python -m venv .local/eval-venv
      - run: .local/eval-venv/bin/python -m pip install --disable-pip-version-check -r scripts/requirements-eval.txt
      - run: .local/eval-venv/bin/python -m pytest -q tests/test_deepeval_suite.py tests/test_stage_pipeline.py tests/test_outcome_controls.py tests/test_reference_api.py --junitxml=reports/runs/python-junit.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: synthetic-python-junit
          path: reports/runs/python-junit.xml
          retention-days: 7
          if-no-files-found: ignore
